[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thermometer"
version = "0.1.0"
description = "温度计：-30~50°C 读数、零上与零下、温差练习纸"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "eastyou" }]
keywords = ["education", "math", "temperature", "thermometer", "worksheet", "printable", "svg"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Education",
]
dependencies = []

[project.scripts]
thermometer = "thermometer.cli:main"

[project.urls]
Homepage = "https://github.com/eastyou/thermometer"
Source = "https://github.com/eastyou/thermometer"

[tool.setuptools]
packages = ["thermometer"]
